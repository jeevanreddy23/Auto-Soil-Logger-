<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Soil Logger Entry</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono-num { font-family: 'Fira Code', monospace; }
  </style>
</head>
<body class="bg-slate-100 p-6 flex justify-center text-slate-800">

  <div class="w-full max-w-4xl bg-white rounded-xl shadow-sm border border-slate-200 p-5">
    <div class="flex items-center justify-between pb-4 border-b border-slate-100">
      <div>
        <h2 class="font-bold text-slate-900 text-sm">Quick Strata Parser & Auto-Chaining</h2>
        <p class="text-xs text-slate-500">Type shorthand (e.g. <code>CH, VST, moist, dk brn, tr sd</code>) or click template chips.</p>
      </div>
      <div class="flex gap-2">
        <button onclick="insertTemplate('topsoil')" class="text-xs bg-slate-50 hover:bg-slate-100 border border-slate-200 px-2.5 py-1 rounded font-medium text-slate-700">+ Topsoil (0.3m)</button>
        <button onclick="insertTemplate('pavement')" class="text-xs bg-slate-50 hover:bg-slate-100 border border-slate-200 px-2.5 py-1 rounded font-medium text-slate-700">+ Basecourse (0.4m)</button>
        <button onclick="insertTemplate('clay')" class="text-xs bg-slate-50 hover:bg-slate-100 border border-slate-200 px-2.5 py-1 rounded font-medium text-slate-700">+ Residual Clay (1.5m)</button>
      </div>
    </div>

    <!-- Shorthand Input Box -->
    <div class="mt-4 flex gap-2">
      <input type="text" id="shorthandInput" placeholder="Quick log: [Type], [Consistency/Density], [Moisture], [Color], [Secondary] — Press Enter" 
             class="flex-1 text-xs border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-sky-500 outline-none font-mono-num bg-slate-50 focus:bg-white transition">
      <button onclick="parseAndAdd()" class="bg-sky-600 hover:bg-sky-700 text-white text-xs font-semibold px-4 py-2 rounded-lg transition">Add Layer</button>
    </div>

    <!-- Live Grid -->
    <div class="mt-4 overflow-x-auto">
      <table class="w-full text-xs text-left border-collapse">
        <thead class="bg-slate-50 text-[10px] uppercase font-bold text-slate-500 font-mono-num border-b border-slate-200">
          <tr>
            <th class="py-2 px-2 w-20 text-right">From (m)</th>
            <th class="py-2 px-2 w-20 text-right">To (m)</th>
            <th class="py-2 px-2 w-28">Type</th>
            <th class="py-2 px-2 w-32">Strength / Density</th>
            <th class="py-2 px-2 w-24">Moisture</th>
            <th class="py-2 px-3">AS 1726 Output</th>
            <th class="py-2 px-2 w-10"></th>
          </tr>
        </thead>
        <tbody id="strataBody" class="divide-y divide-slate-100">
          <!-- Populated dynamically -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let logData = [
      { from: 0.0, to: 0.3, type: "TOPSOIL", param: "Loose", moisture: "Moist", color: "Dark Brown", secondary: "rootlets", output: "TOPSOIL, loose, dark brown, moist, with rootlets." }
    ];

    const aliases = {
      ch: { type: "CLAY (CH)", paramType: "consistency", defaultParam: "Stiff" },
      cl: { type: "CLAY (CL)", paramType: "consistency", defaultParam: "Firm" },
      ci: { type: "CLAY (CI)", paramType: "consistency", defaultParam: "Stiff" },
      mh: { type: "SILT (MH)", paramType: "consistency", defaultParam: "Stiff" },
      ml: { type: "SILT (ML)", paramType: "consistency", defaultParam: "Firm" },
      sp: { type: "SAND (SP)", paramType: "density", defaultParam: "Medium Dense" },
      sw: { type: "SAND (SW)", paramType: "density", defaultParam: "Dense" },
      gp: { type: "GRAVEL (GP)", paramType: "density", defaultParam: "Dense" },
      gw: { type: "GRAVEL (GW)", paramType: "density", defaultParam: "Dense" },
      vst: "Very Stiff", st: "Stiff", f: "Firm", s: "Soft", vs: "Very Soft", h: "Hard",
      vl: "Very Loose", l: "Loose", md: "Medium Dense", d: "Dense", vd: "Very Dense",
      m: "Moist", dry: "Dry", w: "Wet", sat: "Saturated",
      brn: "Brown", dkbrn: "Dark Brown", ltbrn: "Light Brown", rd: "Reddish Brown", gry: "Grey", dkgry: "Dark Grey", yel: "Yellowish Brown"
    };

    function render() {
      const tbody = document.getElementById("strataBody");
      tbody.innerHTML = "";
      logData.forEach((row, i) => {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-slate-50 transition";
        tr.innerHTML = `
          <td class="py-2 px-2 text-right font-mono-num text-slate-500">${row.from.toFixed(2)}</td>
          <td class="py-2 px-2 text-right font-mono-num font-bold text-slate-800">
            <input type="number" step="0.05" value="${row.to.toFixed(2)}" onchange="updateToDepth(${i}, this.value)" 
                   class="w-16 text-right bg-transparent border-b border-transparent focus:border-sky-500 outline-none font-mono-num">
          </td>
          <td class="py-2 px-2 font-semibold text-slate-800">${row.type}</td>
          <td class="py-2 px-2 text-slate-600">${row.param}</td>
          <td class="py-2 px-2 text-slate-600">${row.moisture}</td>
          <td class="py-2 px-3 text-slate-700 italic font-mono-num text-[11px]">${row.output}</td>
          <td class="py-2 px-2 text-center">
            <button onclick="removeRow(${i})" class="text-slate-300 hover:text-rose-500 font-bold">✕</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function updateToDepth(idx, newTo) {
      newTo = parseFloat(newTo);
      if (newTo <= logData[idx].from) return alert("To Depth must exceed From Depth");
      
      const diff = newTo - logData[idx].to;
      logData[idx].to = newTo;

      // Automatically cascade down to adjust subsequent intervals
      for (let j = idx + 1; j < logData.length; j++) {
        logData[j].from = logData[j - 1].to;
        logData[j].to = parseFloat((logData[j].to + diff).toFixed(2));
      }
      render();
    }

    function parseAndAdd() {
      const input = document.getElementById("shorthandInput");
      const val = input.value.trim().toLowerCase();
      if (!val) return;

      const tokens = val.split(/[, ]+/).map(t => t.trim()).filter(Boolean);
      const last = logData[logData.length - 1];
      const from = last ? last.to : 0.0;
      const to = parseFloat((from + 1.2).toFixed(2));

      // Quick token match
      let type = "CLAY (CH)";
      let param = "Stiff";
      let moisture = "Moist";
      let color = "Brown";
      let secondary = "";

      tokens.forEach(tok => {
        if (tok === 'ch') { type = "CLAY (CH)"; param = "Very Stiff"; }
        else if (tok === 'cl') { type = "CLAY (CL)"; param = "Firm"; }
        else if (tok === 'ci') { type = "CLAY (CI)"; param = "Stiff"; }
        else if (tok === 'sp' || tok === 'sand') { type = "SAND (SP)"; param = "Medium Dense"; }
        else if (tok === 'sw') { type = "SAND (SW)"; param = "Dense"; }
        else if (tok === 'gp' || tok === 'gravel') { type = "GRAVEL (GP)"; param = "Dense"; }
        else if (tok === 'top' || tok === 'topsoil') { type = "TOPSOIL"; param = "Loose"; }
        else if (tok === 'shale' || tok === 'sh') { type = "SHALE (Rock)"; param = "Low (L)"; }
        else if (tok === 'sst' || tok === 'sandstone') { type = "SANDSTONE (Rock)"; param = "Medium (M)"; }
        else if (tok === 'vs' || tok === 'vsoft') param = "Very Soft";
        else if (tok === 's' || tok === 'soft') param = "Soft";
        else if (tok === 'f' || tok === 'firm') param = "Firm";
        else if (tok === 'st' || tok === 'stiff') param = "Stiff";
        else if (tok === 'vst' || tok === 'vstiff') param = "Very Stiff";
        else if (tok === 'h' || tok === 'hard') param = "Hard";
        else if (tok === 'vl' || tok === 'vloose') param = "Very Loose";
        else if (tok === 'l' || tok === 'loose') param = "Loose";
        else if (tok === 'md' || tok === 'mdense') param = "Medium Dense";
        else if (tok === 'd' || tok === 'dense') param = "Dense";
        else if (tok === 'vd' || tok === 'vdense') param = "Very Dense";
        else if (tok === 'm' || tok === 'moist') moisture = "Moist";
        else if (tok === 'dry') moisture = "Dry";
        else if (tok === 'w' || tok === 'wet') moisture = "Wet";
        else if (tok === 'sat') moisture = "Saturated";
        else if (tok === 'dk' || tok === 'dkbrn') color = "Dark Brown";
        else if (tok === 'ltbrn') color = "Light Brown";
        else if (tok === 'brn' || tok === 'brown') color = "Brown";
        else if (tok === 'rd' || tok === 'red') color = "Reddish Brown";
        else if (tok === 'gry' || tok === 'grey' || tok === 'gray') color = "Grey";
        else if (tok === 'dkgry') color = "Dark Grey";
        else if (tok === 'yel' || tok === 'yellow') color = "Yellowish Brown";
        else if (tok.startsWith('tr') || tok.includes('trace') || tok.includes('with') || tok.includes('root')) {
          secondary = tok.replace(/^tr\s*/, 'trace ').replace(/^w\/\s*/, 'with ');
        }
      });

      const output = `${type}, ${param.toLowerCase()}, ${color.toLowerCase()}, ${moisture.toLowerCase()}${secondary ? ', ' + secondary : ''}.`;

      logData.push({ from, to, type, param, moisture, color, secondary, output });
      input.value = "";
      render();
    }

    function insertTemplate(type) {
      const last = logData[logData.length - 1];
      const from = last ? last.to : 0.0;
      
      if (type === 'topsoil') {
        const to = parseFloat((from + 0.3).toFixed(2));
        logData.push({ from, to, type: "TOPSOIL", param: "Loose", moisture: "Moist", color: "Dark Brown", secondary: "with rootlets", output: "TOPSOIL, loose, dark brown, moist, with rootlets." });
      } else if (type === 'pavement') {
        const to = parseFloat((from + 0.4).toFixed(2));
        logData.push({ from, to, type: "BASECOURSE (GP)", param: "Dense", moisture: "Dry", color: "Grey", secondary: "crushed basalt", output: "GRAVEL (GP), dense, crushed basalt, grey, dry." });
      } else if (type === 'clay') {
        const to = parseFloat((from + 1.5).toFixed(2));
        logData.push({ from, to, type: "CLAY (CH)", param: "Very Stiff", moisture: "Moist", color: "Reddish Brown", secondary: "high plasticity, trace fine sand", output: "CLAY (CH), very stiff, high plasticity, reddish brown, moist, trace fine sand." });
      }
      render();
    }

    function removeRow(idx) {
      logData.splice(idx, 1);
      // Re-chain
      for (let i = 1; i < logData.length; i++) {
        logData[i].from = logData[i - 1].to;
      }
      render();
    }

    document.getElementById("shorthandInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") parseAndAdd();
    });

    render();
  </script>
</body>
</html>
