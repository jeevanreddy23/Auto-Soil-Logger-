<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0D523E">
<link rel="manifest" href="manifest.webmanifest">
<title>STS GeoFlow — Field Logging</title>
<style>
  :root { --g:#0D523E; --ga:#147447; --ink:#18201C; --sec:#68716C; --bd:#DDE2DE; --soft:#F3F5F3; --warn:#9a7018; --err:#b3392f; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { font-family:Roboto,Inter,system-ui,sans-serif; background:var(--soft); color:var(--ink); padding-bottom:64px; }
  header { background:var(--g); color:#fff; padding:10px 14px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:20; }
  header b { font-size:17px; }
  header small { color:#9fc3b5; font-size:10px; letter-spacing:1px; display:block; }
  .pill { margin-left:auto; font-size:11.5px; padding:4px 10px; border-radius:12px; background:#0F603B; color:#cfe0d8; white-space:nowrap; }
  .pill.off { background:#5c4a12; color:#f5e5b8; }
  .pill.ok { background:#12613c; color:#c9f0d9; }
  .avatar { width:32px; height:32px; border-radius:50%; background:#fff; color:var(--g); font-weight:700; font-size:12px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  main { padding:12px; max-width:640px; margin:0 auto; }
  .card { background:#fff; border:1px solid var(--bd); border-radius:14px; padding:14px; margin-bottom:10px; }
  .card h3 { font-size:15px; margin-bottom:8px; }
  .card .meta { font-size:12px; color:var(--sec); }
  .btn { display:inline-flex; align-items:center; justify-content:center; min-height:46px; padding:0 16px; border-radius:10px;
    border:1px solid var(--bd); background:#fff; color:var(--ink); font-size:15px; font-weight:500; cursor:pointer; }
  .btn.primary { background:var(--ga); border-color:var(--ga); color:#fff; }
  .btn.block { width:100%; margin-top:8px; }
  .btn.big { min-height:64px; font-size:17px; font-weight:600; border-radius:14px; flex-direction:column; }
  .btn.big small { font-weight:400; font-size:11.5px; opacity:.85; }
  .btn:active { opacity:.85; }
  .chips { display:flex; flex-wrap:wrap; gap:7px; margin:6px 0 10px; }
  .chip { min-height:40px; padding:8px 13px; border-radius:20px; border:1px solid var(--bd); background:#fff; font-size:14px; cursor:pointer; }
  .chip.on { background:var(--ga); border-color:var(--ga); color:#fff; }
  label.f { display:block; font-size:12.5px; color:var(--sec); font-weight:500; margin:10px 0 3px; }
  label.f em { color:var(--err); font-style:normal; }
  input.f, select.f, textarea.f { width:100%; min-height:46px; border:1px solid var(--bd); border-radius:10px; padding:10px 12px; font-size:16px; background:#fff; font-family:inherit; }
  textarea.f { min-height:60px; }
  .row2 { display:flex; gap:8px; } .row2 > * { flex:1; }
  .row3 { display:flex; gap:8px; } .row3 > * { flex:1; }
  .depthbtns { display:flex; gap:7px; margin:6px 0; }
  .depthbtns .chip { flex:1; text-align:center; font-variant-numeric:tabular-nums; justify-content:center; display:flex; align-items:center; }
  nav.bottom { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--bd); display:flex; z-index:30; }
  nav.bottom button { flex:1; min-height:56px; border:none; background:none; font-size:11px; color:var(--sec); cursor:pointer; }
  nav.bottom button.on { color:var(--ga); font-weight:600; }
  nav.bottom button span { display:block; font-size:19px; }
  .prev { background:#f2f6f3; border:1px solid #d5e3d9; border-radius:10px; padding:10px 12px; font-size:14px; font-family:Georgia,serif; margin:8px 0; }
  .vwarn { color:var(--warn); font-size:13px; padding:3px 0; }
  .verr { color:var(--err); font-size:13px; padding:3px 0; }
  .vok { color:var(--ga); font-size:13px; }
  .list-item { display:flex; align-items:center; gap:10px; padding:11px 4px; border-bottom:1px solid #ECEFEC; font-size:14px; }
  .list-item .grow { flex:1; min-width:0; }
  .list-item small { color:var(--sec); display:block; font-size:12px; }
  .del { color:var(--err); background:none; border:none; font-size:18px; padding:8px; cursor:pointer; }
  .photo-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:8px; }
  .photo-grid img { width:100%; height:100px; object-fit:cover; border-radius:8px; border:1px solid var(--bd); }
  .tag { font-size:11px; background:#EAF3ED; color:var(--ga); border-radius:8px; padding:2px 8px; }
  .tag.warn { background:#f7efd8; color:var(--warn); }
  h2.screen { font-size:20px; margin:4px 0 12px; }
  .sect { font-size:11.5px; letter-spacing:1.2px; color:var(--sec); font-weight:600; margin:16px 2px 8px; }
  .qgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .qbtn { background:#fff; border:1px solid var(--bd); border-radius:12px; min-height:64px; font-size:13px; font-weight:500; cursor:pointer; color:var(--ink); }
  .qbtn span { display:block; font-size:22px; margin-bottom:2px; }
  .pbar { height:8px; background:#E6EBE7; border-radius:6px; overflow:hidden; margin:8px 0 4px; }
  .pbar i { display:block; height:100%; background:var(--ga); border-radius:6px; }
  .wizbar { height:5px; background:#E6EBE7; border-radius:4px; overflow:hidden; margin:6px 0 14px; }
  .wizbar i { display:block; height:100%; background:var(--ga); }
  .tl { border-left:2px solid var(--bd); margin:8px 0 4px 8px; padding-left:14px; }
  .tl .tli { position:relative; padding:5px 0; font-size:13.5px; }
  .tl .tli::before { content:""; position:absolute; left:-19px; top:11px; width:8px; height:8px; border-radius:50%; background:var(--ga); }
  .tl .tli small { color:var(--sec); }
  .tcard { border:2px solid var(--bd); border-radius:12px; padding:12px; font-size:14px; font-weight:500; cursor:pointer; background:#fff; text-align:center; min-height:60px; display:flex; align-items:center; justify-content:center; }
  .tcard.on { border-color:var(--ga); background:#EAF3ED; color:var(--g); }
  .tgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin:8px 0; }
  #toast { position:fixed; bottom:72px; left:50%; transform:translateX(-50%); background:#123B2C; color:#d7ecdf; padding:8px 18px;
    border-radius:20px; font-size:13px; z-index:60; opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap; }
  .sheet-bg { position:fixed; inset:0; background:rgba(10,20,15,.45); z-index:50; display:flex; align-items:flex-end; }
  .sheet { background:#fff; border-radius:16px 16px 0 0; width:100%; max-width:640px; margin:0 auto; padding:16px 16px 24px; max-height:80vh; overflow:auto; }
  .sheet h3 { margin-bottom:6px; }
  .qrow { display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px solid #ECEFEC; font-size:13.5px; }
  .qrow .st { margin-left:auto; font-size:12px; color:var(--sec); white-space:nowrap; }
  .tsplit { display:grid; grid-template-columns:240px 1fr; gap:14px; align-items:start; }
  @media (min-width:768px){
    body { padding-bottom:0; padding-left:100px; }
    main { max-width:1020px; }
    nav.bottom { left:0; top:0; bottom:0; right:auto; width:100px; flex-direction:column; justify-content:flex-start; border-top:none; border-right:1px solid var(--bd); padding-top:64px; }
    nav.bottom button { flex:0 0 66px; }
    main { max-width:900px; }
    .qgrid { grid-template-columns:repeat(6,1fr); }
    .tgrid { grid-template-columns:repeat(3,1fr); }
    .cols2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:start; }
  }
</style>
</head>
<body>
<header>
  <div><b>STS GeoFlow</b><small>FIELD LOGGING · AS 1726</small></div>
  <div class="pill" id="syncPill">…</div>
  <div class="avatar" id="avatar">·</div>
</header>
<main id="main"></main>
<div id="toast">Saved on device ✓</div>
<nav class="bottom" id="nav">
  <button data-s="home"><span>⌂</span>Home</button>
  <button data-s="jobs"><span>▦</span>Jobs</button>
  <button data-s="bh"><span>✎</span>Log</button>
  <button data-s="photos"><span>📷</span>Photos</button>
  <button data-s="sync"><span>⇅</span>Sync</button>
</nav>
<script>
"use strict";
/* ============ STS GeoFlow — offline-first field workspace ============ */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
const SYNC_URL = "/api/v1/geologger/logs";
const MATERIALS = ["TOPSOIL","FILL","CLAY","Silty CLAY","Sandy CLAY","Gravelly CLAY","SILT","Sandy SILT","Clayey SILT","SAND","Silty SAND","Clayey SAND","Gravelly SAND","GRAVEL","Sandy GRAVEL","Clayey GRAVEL","Residual soil","Extremely weathered rock","SANDSTONE","SHALE","SILTSTONE"];
const COLOURS = ["brown","dark brown","red-brown","yellow-brown","orange-brown","grey","dark grey","light grey","grey-brown","black","mottled"];
const MOIST = ["dry","moist","wet"];
const CONS = ["very soft","soft","firm","stiff","very stiff","hard"];
const DENS = ["very loose","loose","medium dense","dense","very dense"];
const PLAST = ["non-plastic","low plasticity","low to medium plasticity","medium plasticity","medium to high plasticity","high plasticity"];
const EXTRAS = ["trace fine grained sand","with fine to medium grained sand","trace fine sub-angular gravel","with fine to medium sub-angular gravel","with low plasticity silt","rootlets","ironstone gravels","brick fragments"];
const GW_OPTS = ["GWNE","Water struck","Seepage","Standing water","Dry"];
const PH_TYPES = ["Site","Borehole","Soil Sample","SPT","DCP","Corebox","Groundwater","Termination"];
const ROCKS_F = ["SANDSTONE","SHALE","SILTSTONE","LAMINITE","IRONSTONE","CLAYSTONE","GRANITE","BASALT"];
const WEATH_F = [["XW","extremely weathered"],["HW","highly weathered"],["MW","moderately weathered"],["SW","slightly weathered"],["FR","fresh"]];
const STR_F = [["VL","very low"],["L","low"],["M","medium"],["H","high"],["VH","very high"]];
const SMP_CODE = { D:"D", U:"U50", U50:"U50", S:"SPT", B:"BULK", Jar:"JAR", Tube:"U50", Bag:"BULK" };
function autoSid(type){ const code=SMP_CODE[type]||String(type||"S").toUpperCase().slice(0,4);
  const n=(L().samples||[]).filter(s=>(s.sid||"").indexOf(`-${code}-`)>=0).length+1;
  return `${F.activeBh}-${code}-${String(n).padStart(2,"0")}`; }
function sampleHasTest(re){ for (const id in (F.logs||{})) for (const s of (F.logs[id].samples||[]))
  { const t=Array.isArray(s.tests)? s.tests.join(" ") : String(s.tests||""); if (re.test(t+" "+(s.type||""))) return true; } return false; }
function recentFirst(base, used){ const freq={}; used.forEach(v=>{ if(v) freq[v]=(freq[v]||0)+1; });
  return [...base].sort((a,b)=>(freq[b]||0)-(freq[a]||0)); }
const INV_TYPES = ["Boreholes","SPT","DCP","Rock Coring","Test Pits","Hand Augers","Groundwater Monitoring","Sampling","Corebox Photography","Laboratory Testing"];
const BH_STATUS = ["NOT_STARTED","DRILLING","SOIL_LOGGING","ROCK_CORING","WAITING_REVIEW","COMPLETE"];
const ROLES = ["Technician","Driller","Engineer"];
const num = v => { const n = parseFloat(v); return isNaN(n)? null : n; };
const esc = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const uid = () => Math.random().toString(36).slice(2,9);
const now = () => new Date().toISOString();

/* ---- state ---- */
let F = JSON.parse(localStorage.getItem("geoflow")||"null") || {
  project: { projectNumber:"", clientName:"", siteAddress:"", loggedBy:"" },
  boreholes: [], logs: {}, activeBh: null, screen: "home", pending: 0, lastSync: null
};
if (!F.syncKey) F.syncKey = "__autosoil_project__";
if (!F.role) F.role = "Technician";
let PROJECTS_CACHE = JSON.parse(localStorage.getItem("geoflow-remote-projects")||"[]");
/* new-job wizard drafts (global, independent of project slots) */
let WIZ = JSON.parse(localStorage.getItem("geoflow-wizards")||"[]");
function saveWiz(){ localStorage.setItem("geoflow-wizards", JSON.stringify(WIZ)); }
function switchProject(key, meta){
  if (key===F.syncKey) return;
  localStorage.setItem("geoflow-slot-"+F.syncKey, JSON.stringify(F));
  const raw = localStorage.getItem("geoflow-slot-"+key);
  const role = F.role;
  F = raw? JSON.parse(raw) : { project:{ projectNumber:meta?.number||"", clientName:meta?.client||"", siteAddress:meta?.address||"", loggedBy:"" },
    boreholes:[], logs:{}, activeBh:null, screen:"jobs", pending:0, lastSync:null, syncKey:key };
  F.syncKey = key; F.role = role;
  save(false); render();
  if (online()) doSync(false);
}
function blankLogs(){ return { soil:[], rock:[], spt:[], samples:[], drilling:[], gw:{state:"",depth:"",remarks:""}, photos:[], corebox:{img:null,rows:[],defects:[]} }; }
let _toastT = null;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg||"Saved on device ✓"; t.style.opacity="1";
  clearTimeout(_toastT); _toastT=setTimeout(()=>t.style.opacity="0", 1400); }
function save(dirty=true){ if (dirty){ F.pending=(F.pending||0)+1; if (F.activeBh && F.logs[F.activeBh]) F.logs[F.activeBh]._touched=true; }
  localStorage.setItem("geoflow", JSON.stringify(F)); pill(); if (dirty) toast(); }
function normLogs(id){ F.logs[id] = Object.assign(blankLogs(), F.logs[id]||{}); if(!F.logs[id].gw) F.logs[id].gw={state:"",depth:"",remarks:""}; return F.logs[id]; }
function L(){ return F.activeBh? normLogs(F.activeBh) : blankLogs(); }
function bh(){ return F.boreholes.find(b=>b.id===F.activeBh); }
function curDepth(id){ const l=F.logs[id]||blankLogs(); const b=F.boreholes.find(x=>x.id===id)||{};
  return Math.max(...(l.soil||[]).map(r=>num(r.to)||0), ...(l.spt||[]).map(t=>num(t.depth)||0),
    ...(l.drilling||[]).map(d=>num(d.to)||0), num(b.progressDepth)||0, 0); }

/* ---- description generator (AS 1726, STS format) ---- */
const GRAN = m => /SAND|GRAVEL/i.test(m) && !/CLAY|SILT/.test((m||"").split(" ")[0]);
function soilDesc(r){
  if (!r.material) return "";
  const parts=[]; if (r.plasticity) parts.push(r.plasticity); if (r.colour) parts.push(r.colour);
  let out = r.material + ": " + parts.join(", ");
  const ext=(r.extras||[]).join(" ").trim();
  if (ext) out += (parts.length?", ":"") + (r.extras||[]).join(", ");
  if (r.fill) out = "FILL: " + out;
  return out;
}

/* ---- sync ---- */
function online(){ return navigator.onLine; }
function wifiOnlyBlocked(){ /* best-effort: only block auto-sync on known-cellular connections when the setting is ON */
  if (localStorage.getItem("geoflow-wifi")!=="1") return false;
  const c = navigator.connection; return !!(c && c.type==="cellular"); }
function pill(){
  const el=document.getElementById("syncPill");
  if (!online()) { el.className="pill off"; el.textContent=`Offline · ${F.pending||0} pending`; }
  else if (F.pending) { el.className="pill"; el.textContent=`Online · ${F.pending} to sync`; }
  else { el.className="pill ok"; el.textContent="All synced ✓"; }
  const av=document.getElementById("avatar");
  if (av) av.textContent = (F.project.loggedBy||"·").split(/[\/,\s]+/)[0].slice(0,2).toUpperCase()||"·";
}
async function doSync(manual){
  if (!online()) { pill(); if (manual) alert("Offline — changes are stored on this device and will sync when signal returns."); return; }
  if (!manual && wifiOnlyBlocked()) { pill(); return; }
  try {
    const key = localStorage.getItem("geologger-api-key")||"";
    const h = {"Content-Type":"application/json"}; if (key) h["X-Autosoil-Api-Key"]=key;
    /* pull server project state and merge boreholes we don't have */
    const res = await fetch(SYNC_URL, {headers:h});
    let server = null;
    if (res.ok) { const data=await res.json();
      const all = data.boreholes||{};
      /* refresh remote project directory for the picker */
      PROJECTS_CACHE = Object.entries(all)
        .filter(([k])=>k==="__autosoil_project__"||k.startsWith("__project_"))
        .map(([k,v])=>{ const p=v?.rows?.[0]?.project||{};
          return { key:k, number:p.projectNumber||"(no number)", name:p.projectName||"", client:p.clientName||"", address:p.siteAddress||"" }; });
      localStorage.setItem("geoflow-remote-projects", JSON.stringify(PROJECTS_CACHE));
      server = all[F.syncKey]?.rows?.[0]||null;
    }
    if (server) {
      for (const b of (server.boreholes||[])) if (!F.boreholes.some(x=>x.id===b.id)) { F.boreholes.push(b); F.logs[b.id]=server.logs?.[b.id]||blankLogs(); }
      if (!F.project.projectNumber && server.project) F.project=Object.assign({},F.project,{projectNumber:server.project.projectNumber,clientName:server.project.clientName,siteAddress:server.project.siteAddress,loggedBy:server.project.loggedBy});
      /* scope requirements from the approved web scope — drives field prompts, no re-typing */
      if (server.scope){ const acc=(server.scope.items||[]).filter(i=>i.status!=="rej");
        F.scopeReq = { cbr: acc.some(i=>i.name==="CBR"), ss: acc.some(i=>/shrink/i.test(i.name)),
          sptIv: server.scope.plan?.spt?.[0]?.interval||null, labs: server.scope.plan?.totals?.labs||0 };
        /* planned depths from scope baseline */
        for (const pb of (server.scope.plan?.bhs||[])){ const b=F.boreholes.find(x=>x.id===pb.id); if (b && !b.planned && pb.depth) b.planned=pb.depth; }
      }
    }
    /* push merged: field data wins for field-entered boreholes */
    const merged = server || { project:{}, boreholes:[], logs:{}, activeBh:null, activeTab:"dashboard" };
    merged.project = Object.assign({}, merged.project, Object.fromEntries(Object.entries(F.project).filter(([k,v])=>v)));
    if (F.dailyNotes && F.dailyNotes.date===new Date().toISOString().slice(0,10)) merged.dailyNotes=F.dailyNotes;
    for (const b of F.boreholes) {
      const i = merged.boreholes.findIndex(x=>x.id===b.id);
      /* conflict guard: never silently disagree on final depth */
      if (i>=0){ const sv=merged.boreholes[i];
        if (sv.termDepth && b.termDepth && String(sv.termDepth)!==String(b.termDepth)){
          (F.conflicts=F.conflicts||[]).unshift({bh:b.id, field:"final depth", server:sv.termDepth, local:b.termDepth, ts:now()});
          if (F.conflicts.length>20) F.conflicts.length=20;
        } }
      if (i>=0) merged.boreholes[i] = Object.assign({}, merged.boreholes[i], b); else merged.boreholes.push(b);
      const ml = merged.logs[b.id] || (merged.logs[b.id] = { soil:[],rock:[],spt:[],samples:[],corebox:{img:null,natW:0,natH:0,rows:[],defects:[],snap:0.01,layers:{scale:true,grid:true,defects:true,zones:true,labels:true,rows:true},includeMB:false} });
      const fl = F.logs[b.id]||blankLogs();
      if (!(b._field || fl._touched)) continue;   /* untouched server boreholes: never remap */
      /* map field-schema records into web schema; pass web-schema rows through untouched */
      ml.soil = (fl.soil||[]).map(r=> !("extras" in r || "desc" in r) ? r : ({ from:r.from, to:r.to, material:r.material,
        secondary:(r.extras||[])[0]||"", colour:r.colour, moisture:r.moisture,
        consistency:r.consistency, plasticity:r.plasticity, structure:"", origin:r.fill?"fill":"", inclusions:(r.extras||[]).slice(1).join(", "),
        fillNatural:r.fill?"FILL":"NATURAL", uscs:"", description:r.desc||soilDesc(r), descTouched:true, samples:"", sptN:"", dcp:"", envNotes:"", remarks:(r.remarks||"")+" (field)" }));
      ml.spt = (fl.spt||[]).map(t=> ("hammer" in t) ? t : ({ depth:t.depth, seat:t.seat, b1:t.b1, b2:t.b2, b3:t.b3, n:t.n, refusal:!!t.refusal, hammer:"", energy:"", recovery:t.recovery||"", soilDesc:"", remarks:(t.remarks||"")+" (field)" }));
      ml.samples = (fl.samples||[]).map(s=>{ if (!Array.isArray(s.tests)) return s;
        return { sid:s.sid, from:s.from, to:s.to, stype:s.type||"", container:s.container||"", tests:s.tests.join(", "),
        mc:s.tests.includes("Moisture content"), att:s.tests.includes("Atterberg"), psd:s.tests.includes("PSD"), cbr:s.tests.includes("CBR"),
        agg:false, ass:s.tests.includes("ASS"), contam:s.tests.includes("Contamination"), remarks:(s.remarks||"")+" (field)" }; });
      if ((fl.rock||[]).length) ml.rock = fl.rock.map(r=> ("defectType" in r)? r : ({ from:r.from, to:r.to, rockType:r.rockType,
        colour:r.colour, weathering:r.weathering, strength:r.strength, defectType:"", defectAngle:"", defectSpacing:r.defSpacing||"",
        defectRough:"", defectInfill:"", defectAperture:"", defectPersist:"", bedding:"", tcr:r.tcr||"", scr:"", rqd:r.rqd||"",
        is50:"", rockClass:"", description:r.desc||"", descTouched:!!r.desc, remarks:(r.remarks||"")+" (field)" }));
      if (fl.gw && fl.gw.state) merged.project.groundwater = fl.gw.state + (fl.gw.depth? ` at ${fl.gw.depth} m`:"") + (fl.gw.remarks? " — "+fl.gw.remarks : "");
    }
    const push = await fetch(SYNC_URL, { method:"POST", headers:h, body: JSON.stringify({ location:F.syncKey, rows:[merged] }) });
    if (!push.ok) throw new Error("HTTP "+push.status);
    F.pending = 0; F.lastSync = now(); save(false); pill(); render();
    if (manual) alert("Synced to GeoLogger web ✓");
  } catch(e) { pill(); if (manual) alert("Sync failed: "+e.message+"\nData remains safe on this device."); }
}
window.addEventListener("online", ()=>{ pill(); doSync(false); });
window.addEventListener("offline", pill);
setInterval(()=>{ if (F.pending && online()) doSync(false); }, 60000);

/* ---- navigation + session context ---- */
function go(s){
  if (["bh","log","spt","photos","review"].includes(s) && !F.activeBh) s="jobs";
  F.screen=s;
  if (["bh","log","spt","photos","review"].includes(s)) F.lastCtx = { screen:s, bh:F.activeBh, ts:Date.now() };
  save(false); render(); window.scrollTo(0,0);
}

/* ---- bottom sheet helper ---- */
function sheet(html, wireFn){
  const bg=document.createElement("div"); bg.className="sheet-bg";
  bg.innerHTML=`<div class="sheet">${html}</div>`;
  bg.addEventListener("click",e=>{ if(e.target===bg) bg.remove(); });

/* ---- screens ---- */
const SCREENS = ()=>({ home:scrHome, jobs:scrJobs, wizard:scrWizard, bh:scrBh, log:scrLog, spt:scrSpt, photos:scrPhotos, sync:scrSync, review:scrReview, update:scrUpdate });
/* ---------- project update (2-minute end-of-day review) ---------- */
function snapF(){ const s={bh:{},smp:0,spt:0};
  for (const b of F.boreholes){ const l=F.logs[b.id]||{};
    s.bh[b.id]=Math.max(...((l.soil||[]).map(r=>num(r.to)||0)), ...((l.rock||[]).map(r=>num(r.to)||0)), num(b.termDepth)||0, 0);
    s.smp+=((l.samples)||[]).length; s.spt+=((l.spt)||[]).length; }
  return s; }
function scrUpdate(){
  const td=new Date().toISOString().slice(0,10);
  if (!F.dailyNotes || F.dailyNotes.date!==td) F.dailyNotes={ date:td, issues:"", tomorrow:"", weather:"" };
  const base=F.dayBase && F.dayBase.date===td? F.dayBase.snap : {bh:{},smp:0,spt:0};
  const cur=snapF();
  const mToday=F.boreholes.reduce((a,b)=>a+Math.max(0,(cur.bh[b.id]||0)-(base.bh[b.id]||0)),0);
  const comp=F.boreholes.filter(b=>b.termDepth||b.status==="COMPLETE").length;
  const missCbr=F.scopeReq?.cbr && !sampleHasTest(/CBR|BULK/i);
  const missSS=F.scopeReq?.ss && !sampleHasTest(/shrink/i);
  const gw=F.boreholes.map(b=>{ const g=F.logs[b.id]?.gw; return g&&g.state? `${b.id}: ${g.state}${g.depth?` at ${g.depth} m`:""}`:null; }).filter(Boolean);
  const n=F.dailyNotes;
  return `<h2 class="screen">Project update <span class="tag">${td}</span></h2>
  <div class="card"><div class="row2" style="text-align:center">
    <div><b style="font-size:20px">${comp}/${F.boreholes.length}</b><div class="meta">BH complete</div></div>
    <div><b style="font-size:20px">${mToday.toFixed(1)} m</b><div class="meta">drilled today</div></div>
    <div><b style="font-size:20px">${cur.smp-(base.smp||0)}</b><div class="meta">samples today</div></div>
    <div><b style="font-size:20px">${cur.spt-(base.spt||0)}</b><div class="meta">SPT today</div></div>
  </div></div>
  ${missCbr||missSS?`<div class="card" style="border-color:#e0c26a">
    ${missCbr?'<div class="vwarn">⚠ CBR sample still missing (scope requirement)</div>':""}
    ${missSS?'<div class="vwarn">⚠ Shrink-swell sample still missing (scope requirement)</div>':""}</div>`:""}
  <div class="card"><h3>Groundwater</h3><div class="meta">${gw.join("<br>")||"Not recorded / GWNE"}</div>
    ${F.scopeReq?.labs?`<div class="meta" style="margin-top:6px">Lab tests in scope: ${F.scopeReq.labs} — submit samples with the lab schedule.</div>`:""}</div>
  <div class="card"><h3>Notes for today's report</h3>
    <label class="f">Issues / delays</label><input class="f" id="upIss" value="${esc(n.issues)}" placeholder="e.g. access delay BH3">
    <label class="f">Tomorrow's plan</label><input class="f" id="upTom" value="${esc(n.tomorrow)}" placeholder="e.g. continue BH2, start BH3">
    <button class="btn primary block" id="upSave">Save update & sync ✓</button>
    <div class="meta" style="margin-top:6px">These notes feed straight into the Daily Progress email on the website — the PM sees them in the 4:30 pm draft.</div></div>`;
}
function render(){
  let s=F.screen; const map=SCREENS();
  if (!map[s]) s="home";
  if (["bh","log","spt","photos","review"].includes(s) && !F.activeBh) s="jobs";
  const navS = ({home:"home",jobs:"jobs",wizard:"jobs",bh:"bh",log:"bh",spt:"bh",review:"bh",photos:"photos",sync:"sync",update:"home"})[s];
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on", b.dataset.s===navS));
  const m=document.getElementById("main");
  const html=map[s]();
  /* tablet split view: borehole rail beside the working screen */
  if (window.innerWidth>=900 && ["bh","log","spt","photos","update"].includes(s) && F.boreholes.length){
    m.innerHTML = `<div class="tsplit"><aside>${F.boreholes.map(b=>{ const l=F.logs[b.id]||{}; const dep=curDepth(b.id);
      const miss=(!l.gw||!l.gw.state)?" · GW?":"";
      return `<div class="list-item" data-open="${esc(b.id)}" style="cursor:pointer;background:${b.id===F.activeBh?"#EAF3ED":"#fff"};border:1px solid var(--bd);border-radius:10px;margin-bottom:6px;padding:9px 10px">

}

/* ---------- ACTIVE BOREHOLE ---------- */
function scrBh(){
  const b=bh()||{}; const l=L(); const dep=curDepth(F.activeBh); const plan=num(b.planned)||0;
  const acts=[["log","◱","+ Soil interval"],["spt","▼","+ SPT"],["spt","◰","+ Sample"],["photos","📷","+ Photo"],["water","💧","+ Groundwater"],["prog","⏱","+ Progress"]];
  const ev=[];
  (l.soil||[]).forEach(r=>ev.push({d:num(r.from)??0, t:`${r.from}–${r.to} m · ${esc(r.material||"soil")}`, s:esc((r.desc||soilDesc(r)).slice(0,60))}));
  (l.spt||[]).forEach(t=>ev.push({d:num(t.depth)??0, t:`${t.depth} m · SPT N=${t.refusal?"R":(t.n||"—")}`, s:""}));
  (l.samples||[]).forEach(s=>ev.push({d:num(s.from)??0, t:`${s.from} m · Sample ${esc(s.sid)}`, s:""}));
  if (l.gw && l.gw.state && l.gw.state!=="GWNE") ev.push({d:num(l.gw.depth)??0, t:`${l.gw.depth||"?"} m · ${esc(l.gw.state)}`, s:""});
  ev.sort((a,b2)=>a.d-b2.d);

function rockDesc(d){
  if (!d.rockType) return "";

  const s=(STR_F.find(x=>x[0]===d.strength)||[])[1]||"";
  return d.rockType+": "+[s&&s+" strength", w, d.colour].filter(Boolean).join(", ");
}

function scrReview(){
  const l=L(); const b=bh(); const errs=[], warns=[];
  if (!F.project.projectNumber) errs.push("Project number required");
  if (!F.project.loggedBy) errs.push("Logged by required");
  if (!l.gw.state) errs.push("Groundwater state not recorded");
  const iv=l.soil.slice().sort((a,b2)=>num(a.from)-num(b2.from));
  iv.forEach((r,i)=>{ if (num(r.to)<=num(r.from)) errs.push(`Interval ${r.from}–${r.to}: from ≥ to`);
    if (i>0 && num(r.from)>num(iv[i-1].to)+0.011) warns.push(`Gap ${iv[i-1].to}–${r.from} m not logged`);
    if (i>0 && num(r.from)<num(iv[i-1].to)-0.011) errs.push(`Overlap at ${r.from} m`); });
  const term=num(b?.termDepth);
  if (term!=null) { const deepest=Math.max(...iv.map(r=>num(r.to)||0), ...l.spt.map(t=>num(t.depth)||0), 0);
    if (deepest>term+0.011) errs.push(`Records deeper (${deepest} m) than termination ${term} m`); }
  for (const t of l.spt) if (t.b2===""||t.b3==="") if(!t.refusal) warns.push(`SPT at ${t.depth} m missing blow counts`);
  return `<h2 class="screen">${esc(F.activeBh)} — Review & sync</h2>
  <div class="card">
    ${errs.map(e=>`<div class="verr">✗ ${esc(e)}</div>`).join("")}
    ${warns.map(w=>`<div class="vwarn">⚠ ${esc(w)}</div>`).join("")}
    ${!errs.length&&!warns.length?'<div class="vok">✓ No validation issues</div>':""}
  </div>
  <div class="card"><h3>Ready</h3><div class="meta">
    ${l.soil.length} soil intervals · ${l.spt.length} SPT · ${l.samples.length} samples · ${l.photos.length} photos<br>
    Groundwater: ${esc(l.gw.state||"—")}${l.gw.depth?` at ${l.gw.depth} m`:""}<br>
    Last sync: ${F.lastSync? new Date(F.lastSync).toLocaleString() : "never"} · Pending changes: ${F.pending||0}
  </div>
  <button class="btn primary block" id="syncNow" ${errs.length?'style="opacity:.55"':""}>${errs.length?"Sync draft (has errors)":"Submit & sync to GeoLogger ✓"}</button>
  <button class="btn block" id="markDone">Mark ${esc(F.activeBh)} complete</button>
  <button class="btn block" id="backBh">← ${esc(F.activeBh)} overview</button></div>`;
}

function quickAction(k){

function batchCreate(pre,start,count,depth,target){
  for (let i=0;i<count;i++){
    const id=pre+String(start+i).padStart(2,"0");
    if (target.some(b=>b.id===id)) continue;
    target.push({ id, planned:depth, termDepth:"", termReason:"", status:"NOT_STARTED", _field:true });
  }
}

    const gu=m.querySelector("#goUpdate"); if (gu) gu.addEventListener("click",()=>go("update"));
    m.querySelector("#newJob").addEventListener("click",()=>{ const w=newWizDraft(); WIZ.push(w); saveWiz(); F.wizId=w.id; go("wizard"); });
    m.querySelectorAll("[data-wiz]").forEach(b=>b.addEventListener("click",()=>{ F.wizId=b.dataset.wiz; go("wizard"); }));
    m.querySelectorAll("[data-wizdel]").forEach(b=>b.addEventListener("click",()=>{
      if (!confirm("Delete this job draft?")) return; WIZ=WIZ.filter(w=>w.id!==b.dataset.wizdel); saveWiz(); render(); }));
    const rs=m.querySelector("#resumeSess");
    if (rs) rs.addEventListener("click",()=>{ F.activeBh=F.lastCtx.bh; normLogs(F.activeBh); go(F.lastCtx.screen||"bh"); });
    const cb=m.querySelector("#contBh");
    if (cb) cb.addEventListener("click",()=>{ F.activeBh=cb.dataset.bh; normLogs(F.activeBh);
      go(F.lastCtx && F.lastCtx.bh===cb.dataset.bh ? (F.lastCtx.screen||"bh") : "bh"); });
  }
  if (s==="wizard"){
    const w=curWiz(); if (!w) return;
    const touch=()=>{ w.updated=now(); saveWiz(); toast(); };
    m.querySelectorAll("[data-w]").forEach(i=>i.addEventListener("input",()=>{
      const [o,k]=i.dataset.w.split("."); w[o][k]=i.value; touch(); }));
    m.querySelectorAll("[data-inv]").forEach(c=>c.addEventListener("click",()=>{
      const t=c.dataset.inv; const a=w.invest.types;
      a.includes(t)? a.splice(a.indexOf(t),1) : a.push(t); c.classList.toggle("on"); touch(); }));
    m.querySelectorAll("[data-bhd]").forEach(i=>i.addEventListener("input",()=>{ w.bhs[+i.dataset.bhd].planned=i.value; touch(); }));
    m.querySelectorAll("[data-bhx]").forEach(b=>b.addEventListener("click",()=>{ w.bhs.splice(+b.dataset.bhx,1); touch(); render(); }));
    const ab=m.querySelector("#wizAddBh");
    if (ab) ab.addEventListener("click",()=>{ const id=prompt("Borehole ID:","BH"+String(w.bhs.length+1).padStart(2,"0"));
      if (!id||w.bhs.some(b=>b.id===id)) return; w.bhs.push({id,planned:""}); touch(); render(); });
    const bc=m.querySelector("#wizBatch");
    if (bc) bc.addEventListener("click",()=>{
      batchCreate(m.querySelector("#bcPre").value||"BH", parseInt(m.querySelector("#bcStart").value)||1,
        parseInt(m.querySelector("#bcCount").value)||0, m.querySelector("#bcDepth").value, w.bhs);
      touch(); render(); });
    const gps=m.querySelector("#wizGps");
    if (gps) gps.addEventListener("click",()=>{
      const out=m.querySelector("#wizGpsOut"); out.textContent="Acquiring GPS…";
      if (!navigator.geolocation) { out.textContent="GPS not available on this device."; return; }
      navigator.geolocation.getCurrentPosition(p=>{
        w.site.lat=p.coords.latitude.toFixed(6); w.site.lng=p.coords.longitude.toFixed(6);
        w.site.acc=Math.round(p.coords.accuracy); w.site.gpsTime=now(); touch();
        out.textContent=`GPS: ${w.site.lat}, ${w.site.lng} (±${w.site.acc} m)`; },
      ()=>{ out.textContent="GPS unavailable — enter coordinates manually."; }, {timeout:10000, enableHighAccuracy:true}); });
    const nx=m.querySelector("#wizNext");
    if (nx) nx.addEventListener("click",()=>{
      if (w.step===1 && (!w.job.projectNumber||!w.job.projectName||!w.job.clientName)) return alert("Project number, name and client are required.");
      w.step=Math.min(5,w.step+1); touch(); render(); });
    const bk=m.querySelector("#wizBack");
    if (bk) bk.addEventListener("click",()=>{ w.step=Math.max(1,w.step-1); touch(); render(); });
    const dr=m.querySelector("#wizDraft");
    if (dr) dr.addEventListener("click",()=>{ touch(); toast("Draft saved — continue any time"); go("home"); });
    const st=m.querySelector("#wizStart");
    if (st) st.addEventListener("click",()=>{ if (!w.job.projectNumber||!w.job.clientName) return; startFieldWork(w); });
  }
  if (s==="bh"){
    m.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",()=>{
      const a=b.dataset.act;
      if (a==="water") qaWater(); else if (a==="prog") qaProgress(); else go(a); }));
    m.querySelector("#goLog").addEventListener("click",()=>go("log"));
    m.querySelector("#goReview").addEventListener("click",()=>go("review"));
  }
  if (s==="log"){
    const d=F.draft;
    const upd=()=>{ const el=document.getElementById("descPrev"); if (el) el.textContent = (d.kind==="rock"? rockDesc(d):soilDesc(d))||"—"; };
    m.querySelectorAll("[data-kind]").forEach(c=>c.addEventListener("click",()=>{
      d.kind=c.dataset.kind; d.fill = d.kind==="fill"; render(); }));
    m.querySelectorAll("[data-ck]").forEach(c=>c.addEventListener("click",()=>{
      const k=c.dataset.ck;
      if (k==="fill") d.fill=!d.fill; else d[k] = d[k]===c.dataset.cv? "" : c.dataset.cv;
      render(); }));
    const dup=m.querySelector("#dupLayer");
    if (dup) dup.addEventListener("click",()=>{
      const l2=L(); const last = d.kind==="rock"? (l2.rock||[]).at(-1) : l2.soil.at(-1);
      if (!last) return alert("Nothing to duplicate yet.");
      const keep={from:num(last.to)??d.from, to:""};
      F.draft=Object.assign({}, last, keep, {kind:d.kind, extras:(last.extras||[]).slice(), remarks:""});
      render(); });
    const sfi=m.querySelector("#smpFromIv");
    if (sfi) sfi.addEventListener("click",()=>{
      const f=num(document.getElementById("dFrom").value), t=num(document.getElementById("dTo").value);
      sheet(`<h3>Sample at ${f??"?"}–${t??"?"} m</h3>
        <label class="f">Type</label><div class="chips">${["D","U50","B","Jar","Bag"].map(v=>`<button class="chip" data-qst="${v}">${v}</button>`).join("")}</div>
        <label class="f">Tests</label><div class="chips">${["Moisture content","Atterberg","PSD","CBR","Shrink-swell"].map(v=>`<button class="chip" data-qtt="${v}">${v}</button>`).join("")}</div>
        <button class="btn primary block" id="qsSave">Save sample ✓</button>`,
      (bg,close)=>{ let ty="D", ts=[];
        bg.querySelectorAll("[data-qst]").forEach(c=>c.addEventListener("click",()=>{ ty=c.dataset.qst; bg.querySelectorAll("[data-qst]").forEach(x=>x.classList.toggle("on",x===c)); }));
        bg.querySelectorAll("[data-qtt]").forEach(c=>c.addEventListener("click",()=>{ const v=c.dataset.qtt; ts.includes(v)?ts.splice(ts.indexOf(v),1):ts.push(v); c.classList.toggle("on"); }));
        bg.querySelector("#qsSave").addEventListener("click",()=>{
          L().samples.push({ sid:autoSid(ty), from:f??0, to:t??f??0, type:ty, container:"", tests:ts.slice(), remarks:"" });
          save(); close(); toast("Sample "+autoSid(ty).replace(/\d+$/,x=>String(+x-1).padStart(2,"0"))+" saved"); render(); }); }); });
    m.querySelectorAll("[data-dri]").forEach(b=>b.addEventListener("click",()=>{ (L().rock||[]).splice(+b.dataset.dri,1); save(); render(); }));
    const mf=m.querySelector("#dMatFree"); if (mf) mf.addEventListener("input",()=>{ d.material=mf.value; upd(); });
    ["dDefSp","dTcr","dRqd"].forEach(id=>{ const el=m.querySelector("#"+id); if (el) el.addEventListener("input",()=>{
      d.defSpacing=m.querySelector("#dDefSp")?.value||d.defSpacing; d.tcr=m.querySelector("#dTcr")?.value||d.tcr; d.rqd=m.querySelector("#dRqd")?.value||d.rqd; }); });
    m.querySelectorAll("[data-ex]").forEach(c=>c.addEventListener("click",()=>{
      const v=c.dataset.ex; d.extras=d.extras||[];
      d.extras.includes(v)? d.extras.splice(d.extras.indexOf(v),1) : d.extras.push(v);
      c.classList.toggle("on"); upd(); }));
    m.querySelectorAll("[data-plus]").forEach(c=>c.addEventListener("click",()=>{
      const f=num(document.getElementById("dFrom").value)||0;
      document.getElementById("dTo").value=(Math.round((f+parseFloat(c.dataset.plus))*100)/100); d.to=document.getElementById("dTo").value; }));
    const sel=m.querySelector("#dMatSel"); if (sel) sel.addEventListener("change",()=>{ if(sel.value){ d.material=sel.value; render(); } });
    ["dFrom","dTo","dRem"].forEach(id=>{ const el=m.querySelector("#"+id); if(el) el.addEventListener("input",()=>{ d.from=num(document.getElementById("dFrom").value)??d.from; d.to=document.getElementById("dTo").value; d.remarks=document.getElementById("dRem").value; }); });
    m.querySelector("#saveIv").addEventListener("click",()=>{
      d.from=num(document.getElementById("dFrom").value); d.to=num(document.getElementById("dTo").value);
      if (d.from==null||d.to==null||d.to<=d.from) return alert("Check From/To depths");
      if (d.kind==="rock"){
        if (!d.rockType) return alert("Pick a rock type");
        d.desc=rockDesc(d);
        (L().rock=L().rock||[]).push({ from:d.from, to:d.to, rockType:d.rockType, colour:d.colour, weathering:d.weathering,
          strength:d.strength, defSpacing:d.defSpacing, tcr:d.tcr, rqd:d.rqd, desc:d.desc, remarks:d.remarks, _field:1 });
        if (bh()) bh().status="ROCK_CORING";
        F.draft=Object.assign({},d,{ from:d.to, to:"", remarks:"" });
        save(); render(); return;
      }
      if (!d.material) return alert("Pick a material");
      d.desc=soilDesc(d);
      L().soil.push(JSON.parse(JSON.stringify(d)));
      if (bh() && (bh().status==="NOT_STARTED"||!bh().status)) bh().status="SOIL_LOGGING";
      /* scope-aware prompts: only when the approved scope requires it and it's still missing */
      if (F.scopeReq?.ss && /CLAY/i.test(d.material) && !sampleHasTest(/shrink/i)){
        if (confirm("Scope requires a SHRINK-SWELL sample and none is collected yet.\nAdd a U50 sample at "+d.from+"–"+d.to+" m?"))
          L().samples.push({ sid:autoSid("U50"), from:d.from, to:d.to, type:"U50", container:"", tests:["Shrink-swell"], remarks:"scope requirement" });
      } else if (F.scopeReq?.cbr && GRAN(d.material) && !sampleHasTest(/CBR|BULK/i)){
        if (confirm("Scope requires a CBR (bulk) sample and none is collected yet.\nAdd a bulk sample at "+d.from+"–"+d.to+" m?"))
          L().samples.push({ sid:autoSid("B"), from:d.from, to:d.to, type:"B", container:"", tests:["CBR"], remarks:"scope requirement" });
      }
      F.draft={ kind:"soil", from:d.to, to:"", material:d.material, colour:d.colour, moisture:d.moisture, consistency:d.consistency, plasticity:d.plasticity, extras:[], fill:false, remarks:"",
        rockType:"", weathering:"", strength:"", defSpacing:"", tcr:"", rqd:"" };
      save(); render(); });
    m.querySelectorAll("[data-di]").forEach(b=>b.addEventListener("click",e=>{ e.stopPropagation(); L().soil.splice(+b.dataset.di,1); save(); render(); }));
    m.querySelectorAll("[data-gw]").forEach(c=>c.addEventListener("click",()=>{ L().gw.state=c.dataset.gw; save(); render(); }));
    const gwD=m.querySelector("#gwD"); if(gwD) gwD.addEventListener("input",()=>{ L().gw.depth=gwD.value; save(); });
    const tD=m.querySelector("#termD"); if(tD) tD.addEventListener("input",()=>{ if(bh()) bh().termDepth=tD.value; save(); });
  }
  if (s==="spt"){
    let refusal=false, smType="", smTests=[];
    const calc=()=>{ const b2=num(document.getElementById("sB2").value), b3=num(document.getElementById("sB3").value);
      document.getElementById("sN").textContent = refusal? "N = R" : (b2!=null&&b3!=null? "N = "+(b2+b3) : "N = —"); };
    ["sB1","sB2","sB3"].forEach(id=>m.querySelector("#"+id).addEventListener("input",calc));
    m.querySelector("#sRef").addEventListener("click",e=>{ refusal=!refusal; e.target.classList.toggle("on"); calc(); });
    m.querySelector("#sSave").addEventListener("click",()=>{
      const dpt=num(document.getElementById("sD").value); if (dpt==null) return alert("Enter depth");
      if (L().spt.some(t=>num(t.depth)===dpt)) return alert("SPT already exists at this depth");
      const b2=num(document.getElementById("sB2").value), b3=num(document.getElementById("sB3").value);
      L().spt.push({ depth:dpt, seat:document.getElementById("sSeat").value, b1:document.getElementById("sB1").value,
        b2:document.getElementById("sB2").value, b3:document.getElementById("sB3").value,
        n: refusal? "R" : (b2!=null&&b3!=null? String(b2+b3):""), refusal, recovery:"", remarks:"" });
      save(); render(); });
    m.querySelectorAll("[data-si]").forEach(b=>b.addEventListener("click",()=>{ L().spt.splice(+b.dataset.si,1); save(); render(); }));
    m.querySelectorAll("[data-smtype]").forEach(c=>c.addEventListener("click",()=>{ smType=c.dataset.smtype;
      m.querySelectorAll("[data-smtype]").forEach(x=>x.classList.toggle("on",x===c)); }));
    m.querySelectorAll("[data-smtest]").forEach(c=>c.addEventListener("click",()=>{
      const v=c.dataset.smtest; smTests.includes(v)? smTests.splice(smTests.indexOf(v),1):smTests.push(v); c.classList.toggle("on"); }));
    m.querySelector("#smSave").addEventListener("click",()=>{
      const f=num(document.getElementById("smF").value); if (f==null) return alert("Enter sample depth");
      L().samples.push({ sid:autoSid(smType||"D"),
        from:f, to:num(document.getElementById("smT").value)??f, type:smType, container:"", tests:smTests.slice(), remarks:"" });
      save(); render(); });
    m.querySelectorAll("[data-smi]").forEach(b=>b.addEventListener("click",()=>{ L().samples.splice(+b.dataset.smi,1); save(); render(); }));
  }
  if (s==="photos"){
    let gps=null;
    const d=F.phDraft;
    m.querySelectorAll("[data-pht]").forEach(c=>c.addEventListener("click",()=>{ d.type=c.dataset.pht;
      m.querySelectorAll("[data-pht]").forEach(x=>x.classList.toggle("on",x.dataset.pht===d.type)); }));
    const ps=m.querySelector("#phSample"); if (ps) ps.addEventListener("change",()=>{ d.sample=ps.value; });
    if (navigator.geolocation) navigator.geolocation.getCurrentPosition(
      p=>{ gps={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};
        const el=document.getElementById("phGps"); if(el) el.textContent=`GPS: ${gps.lat.toFixed(6)}, ${gps.lng.toFixed(6)} (±${Math.round(gps.acc)} m)`; },
      ()=>{ const el=document.getElementById("phGps"); if(el) el.textContent="GPS unavailable — photos still saved."; }, {timeout:8000});
    m.querySelector("#phFile").addEventListener("change",e=>{
      const f=e.target.files[0]; if(!f) return;
      const rd=new FileReader();
      rd.onload=()=>{ const img=new Image(); img.onload=()=>{
        const cv=document.createElement("canvas"); const sc=Math.min(1, 900/img.width);
        cv.width=img.width*sc; cv.height=img.height*sc;
        cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        L().photos.push({ id:uid(), img:cv.toDataURL("image/jpeg",0.62), depth:document.getElementById("phD").value,
          caption:document.getElementById("phC").value, type:d.type, sample:d.sample||"", ts:now(), by:F.project.loggedBy||"", gps, syncStatus:"LOCAL_ONLY" });
        save(); render(); };
        img.src=rd.result; };
      rd.readAsDataURL(f); });
  }
  if (s==="update"){
    const n=F.dailyNotes;
    m.querySelector("#upIss").addEventListener("input",e=>{ n.issues=e.target.value; });
    m.querySelector("#upTom").addEventListener("input",e=>{ n.tomorrow=e.target.value; });
    m.querySelector("#upSave").addEventListener("click",()=>{ save(); toast("Update saved"); doSync(false); go("home"); });
  }
  if (s==="sync"){
    m.querySelector("#syncNow").addEventListener("click",()=>doSync(true));
    m.querySelectorAll("[data-cfx]").forEach(b=>b.addEventListener("click",()=>{
      F.conflicts.splice(+b.dataset.cfx,1); save(false); render(); }));
    m.querySelector("#wifiTgl").addEventListener("click",()=>{
      const on=localStorage.getItem("geoflow-wifi")==="1";
      localStorage.setItem("geoflow-wifi", on?"0":"1"); render(); });
    m.querySelector("#setKey").addEventListener("click",()=>{
      const k=prompt("AutoSoil API key (leave empty if none):", localStorage.getItem("geologger-api-key")||"");
      if (k===null) return; if (k) localStorage.setItem("geologger-api-key",k); else localStorage.removeItem("geologger-api-key"); });
  }
  if (s==="review"){
    m.querySelector("#syncNow").addEventListener("click",()=>doSync(true));
    const md=m.querySelector("#markDone");
    if (md) md.addEventListener("click",()=>{ if (bh()) { bh().status="COMPLETE"; save(); toast(F.activeBh+" marked complete"); render(); } });
  }
  m.querySelectorAll("#backBh").forEach(b=>b.addEventListener("click",()=>go("bh")));
}
/* start-of-day baseline for "today's" metres/samples/SPT */
(function(){ const td=new Date().toISOString().slice(0,10);
  if (!F.dayBase || F.dayBase.date!==td) { F.dayBase={ date:td, snap:snapF() }; save(false); } })();
/* boot: always land on Home so the field workspace answers "what am I doing today?" first */
if (!SCREENS()[F.screen] || F.screen==="boreholes") F.screen="home";
if (!["wizard"].includes(F.screen)) F.screen="home";
render();
if (online() && F.pending) doSync(false);
</script>
</body>
</html>
