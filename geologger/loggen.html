<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeoFlow | Log PDF studio</title>
<style>body{margin:0;background:#eef4f3;color:#1d3035;font:15px Arial}header{background:#1d3035;color:white;padding:22px 4vw}h1{margin:0 0 8px}main{display:grid;grid-template-columns:minmax(280px,38%) 1fr;gap:24px;padding:24px 4vw}textarea{box-sizing:border-box;width:100%;height:65vh;border:1px solid #bdcecb;border-radius:8px;padding:14px;font:12px monospace}button,a{display:inline-block;padding:11px 16px;margin:8px 6px 8px 0;border:0;border-radius:5px;background:#116869;color:white;text-decoration:none;cursor:pointer}iframe{width:100%;height:80vh;border:0;background:white}#status{line-height:1.5}label{display:block;font-weight:bold;margin-bottom:10px}@media(max-width:800px){main{grid-template-columns:1fr}}</style>
<script src="vendor/jspdf.umd.min.js"></script><script src="geoflow-domain.js"></script><script src="geoflow-ui-core.js"></script><script src="geoflow-log-pdf.js"></script></head>
<body><header><h1>GeoFlow / Log PDF studio</h1>Soil and rock profiles with a shared depth timeline</header><main><section><label for="jsonIn">Log data</label><p>Paste a GeoFlow project snapshot or legacy header/strata JSON. Nothing is saved to your projects.</p><textarea id="jsonIn" spellcheck="false"></textarea><button id="generate">Generate preview</button><button id="download" disabled>Download PDF</button><a href="/">Open GeoFlow</a><p id="status" role="status"></p></section><iframe id="preview" title="Generated GeoFlow PDF"></iframe></main>
<script>
const example={header:{bh_id:'BH-DEMO',job_no:'DEMONSTRATION',client:'Fictional sample data',address:'Design verification only',logged_by:'Demo'},strata:[{depth_start:0,depth_end:2,description:'Silty CLAY: brown, medium plasticity',symbol:'CI',consistency:'Stiff',moisture:'Moist'},{depth_start:2,depth_end:5,description:'SAND: pale grey, fine grained',symbol:'SP',consistency:'Dense',moisture:'Wet'}],termination_depth:5,termination_text:'Target depth reached'};
function adapt(data){
 if(Array.isArray(data.boreholes)&&data.logs)return data;
 const h=data.header||{},id=h.bh_id||'BH-01';
 return {project:{projectNumber:h.job_no,clientName:h.client,siteAddress:h.address,dateInvestigation:h.date,loggedBy:h.logged_by,reviewBy:h.reviewed_by,drillingContractor:h.drilling_contractor,groundRL:h.surface_rl,drillRig:h.plant,inclination:h.inclination,holeDia:h.hole_diameter_mm,drillBit:h.drill_bit,locationNo:h.location_no},boreholes:[{id,termDepth:data.termination_depth,termReason:data.termination_text}],logs:{[id]:{soil:(data.strata||[]).map(r=>({from:r.depth_start,to:r.depth_end,material:r.material||r.description?.split(':')[0]||'Material',description:r.description,uscs:r.symbol,consistency:r.consistency,moisture:r.moisture})),rock:[],samples:[],spt:[],gw:data.groundwater||{},observations:(data.tests||[]).map(r=>({label:'Field test at '+r.depth+' m',text:[r.line1,r.line2].filter(Boolean).join('\n')}))}}};
}
let current=null,url=null;
const input=document.getElementById('jsonIn'),status=document.getElementById('status'),download=document.getElementById('download'),preview=document.getElementById('preview');
input.value=JSON.stringify(example,null,2);
function generate(){
 current=null;download.disabled=true;
 if(url){URL.revokeObjectURL(url);url=null;}preview.removeAttribute('src');
 try{const state=adapt(JSON.parse(input.value)),id=state.boreholes[0]?.id;if(!id)throw Error('A borehole is required.');
 const issues=GeoFlowUICore.collectValidation(state).filter(i=>!i.boreholeId||i.boreholeId===id);
 current=GeoFlowLogPDF.build(state,id,{jsPDF:jspdf.jsPDF,validation:{errors:issues.filter(i=>i.severity==='error').map(i=>i.message),warnings:issues.filter(i=>i.severity!=='error').map(i=>i.message)}});
 url=URL.createObjectURL(current.output('blob'));preview.src=url;download.disabled=false;status.textContent=id+' / '+current.getNumberOfPages()+' pages. '+issues.length+' QA observations. '+(issues.length?'Review in GeoFlow before issue.':'');
 }catch(error){status.textContent='Cannot generate PDF: '+error.message;}
}
document.getElementById('generate').onclick=generate;download.onclick=()=>current?.save('geoflow-log.pdf');input.oninput=()=>{current=null;download.disabled=true;status.textContent='Data changed. Generate a new preview.';};generate();
</script></body></html>
