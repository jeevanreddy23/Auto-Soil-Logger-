<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STS GeoFlow Responsive Harness</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { display: grid; place-items: start center; overflow: auto; background: #dfe4e1; }
    iframe { display: block; border: 0; background: #fff; box-shadow: 0 0 0 1px #c9d1cc; }
  </style>
</head>
<body>
  <iframe id="sandboxViewport" title="STS GeoFlow responsive sandbox"></iframe>
  <script>
    const params = new URLSearchParams(location.search);
    const width = Math.max(320, Math.min(1920, Number(params.get("width")) || 390));
    const height = Math.max(568, Math.min(1400, Number(params.get("height")) || 844));
    const route = params.get("route") || "projects";
    const frame = document.getElementById("sandboxViewport");
    frame.style.width = `${width}px`;
    frame.style.height = `${height}px`;
    frame.src = `index.html?motion=harness-${width}x${height}#/${route}`;
  </script>
</body>
</html>
